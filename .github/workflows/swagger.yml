# Fails when docs/references/api/swagger.json does not match what
# `make swagger` generates from the annotations in internal/api/v1/docs.
name: swagger

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'internal/api/**'
    - 'pkg/api/core/v1/models/**'
    - 'pkg/api/core/v1/errors/**'
    - 'docs/references/api/**'
    - 'scripts/swagger-postprocess.sh'
    - 'Makefile'
    - '.github/workflows/swagger.yml'

jobs:
  drift:
    name: swagger drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Regenerate and validate the spec
        run: make swagger

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- docs/references/api/swagger.json; then
            echo "::error::swagger.json is out of date; run 'make swagger'" \
              "and commit the result."
            exit 1
          fi
