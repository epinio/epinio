# EPINIO-823: Harbor app-chart acceptance on GitHub-hosted runners (k3d).
# Complements the RKE self-hosted job in rke.yml (acceptance-scenario-harbor).

name: Harbor-k3d-CI

on:
  # GitHub-hosted (ubuntu-latest). Do not wait on self-hosted RKE runners.
  # synchronize = every push to the PR; ready_for_review for draft→ready.
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'acceptance/install/scenario_harbor_appcharts_test.go'
      - 'acceptance/helpers/harbor/**'
      - 'acceptance/appcharts_push_test.go'
      - 'acceptance/helpers/catalog/download.go'
      - '.github/workflows/harbor-k3d.yml'
  workflow_dispatch:

env:
  SETUP_GO_VERSION: '1.26.0'
  GINKGO_VERSION: v2.27.2
  INGRESS_CONTROLLER: nginx

jobs:
  acceptance-harbor-k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GINKGO_NODES: 1
      EPINIO_TIMEOUT_MULTIPLIER: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          cache: false
          go-version: ${{ env.SETUP_GO_VERSION }}

      - name: Setup Ginkgo Test Framework
        run: go install github.com/onsi/ginkgo/v2/ginkgo@${{ env.GINKGO_VERSION }}

      - name: Cache Tools
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/tools
          key: ${{ runner.os }}-tools

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Tools
        run: make tools-install

      - name: Add Tools to PATH
        run: |
          echo "`pwd`/output/bin" >> $GITHUB_PATH

      - name: Harbor App Chart Acceptance (k3d)
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          # Loopback domain needs ingress ClusterIP DNS for in-cluster Harbor access.
          HARBOR_PATCH_INGRESS_DNS: "1"
        run: |
          export EPINIO_SYSTEM_DOMAIN=127.0.0.1.sslip.io
          export EPINIO_PORT=8443
          make acceptance-cluster-setup
          export KUBECONFIG=$(k3d kubeconfig write epinio-acceptance)

          # Ingress + cert-manager only (scenario installs Epinio with Harbor itself).
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.ingressClassResource.default=true \
            --set controller.admissionWebhooks.enabled=false \
            --wait
          make install-cert-manager

          make test-acceptance-harbor

      - name: Cleanup k3d cluster
        if: always()
        run: make acceptance-cluster-delete
